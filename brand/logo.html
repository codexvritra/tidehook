<!doctype html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:400px;height:400px;background:#070808;overflow:hidden}
.bg{position:absolute;inset:0;background-image:linear-gradient(rgba(208,255,0,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(208,255,0,.06) 1px,transparent 1px);background-size:20px 20px}
.glow{position:absolute;left:50%;top:50%;width:300px;height:300px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(208,255,0,.18),transparent 65%)}
img{position:absolute;left:50%;top:50%;width:208px;height:208px;transform:translate(-50%,-52%);image-rendering:pixelated;filter:drop-shadow(0 0 18px rgba(208,255,0,.45))}
</style></head><body><div class="bg"></div><div class="glow"></div><img src="mark.svg"></body></html>
